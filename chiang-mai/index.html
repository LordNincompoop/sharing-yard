<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiang Mai">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23000000%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2752%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27sans-serif%27 font-weight=%27700%27%3ECM%3C/text%3E%3C/svg%3E">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Chiang Mai Market Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: two day sections, each a plain list of stops with a Google Maps link */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#111111; --muted:#555555; --line:#d4d4d4;
  --indigo:#111111; --gold:#111111;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#000000; --ink:#f2f2f2; --muted:#a8a8a8; --line:#3a3a3a;
  --indigo:#ffffff; --gold:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#000000; --ink:#f2f2f2; --muted:#a8a8a8; --line:#3a3a3a;
  --indigo:#ffffff; --gold:#ffffff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
section{display:flex;flex-direction:column;gap:8px}
h2{font:800 22px/1.2 var(--display);margin:0;text-wrap:balance}
.dayhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.route{font:600 13.5px var(--body);color:var(--indigo);text-decoration:none}
.slot{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.time{font:600 14px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);padding-top:1px}
.body{min-width:0}
.name{font:600 16px/1.3 var(--display);margin:0}
.opt{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);margin-left:6px;vertical-align:2px}
.note{font-size:13.5px;color:var(--muted);margin:3px 0 0}
.map{display:inline-block;margin-top:5px;font:600 13.5px var(--body);color:var(--indigo);text-decoration:underline;text-underline-offset:3px}
a:hover{text-decoration:underline}
.routes{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px}
.routes a{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;color:var(--ink);text-decoration:none;font:600 14px var(--body)}
.routes a span{color:var(--muted);font-weight:500;font-size:12.5px}
.rtitle{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Chiang Mai Market Trip</h1>
    <p class="sub">Fri 23 – Sat 24 October · times are rough, go at your own pace</p>
  </header>
  <div id="days"></div>
</div>

<script>
const STOPS = [
 {day:1,slot:"On the way from Mae Chan",time:"10:45",name:"Leave Mae Kachan Hot Spring",note:"About 1 hr 15 min to Tha Phae Gate.",q:"Mae Kachan Hot Spring Wiang Pa Pao"},
 {day:1,slot:"Midday",time:"~12:15",name:"Tha Phae Gate + lunch",note:"Done: photos at the gate and lunch nearby.",q:"Tha Phae Gate Chiang Mai"},
 {day:1,slot:"Afternoon",time:"~1:50",name:"Wat Chedi Luang + Art in Paradise",note:"Done.",q:"Art in Paradise Chiang Mai"},
 {day:1,slot:"Afternoon",time:"~4:30",name:"Early dinner",note:"Done: eating now.",q:"Art in Paradise Chiang Mai"},
 {day:1,slot:"Evening",time:"~5:15",name:"Check in: Moose EASY Hotel",note:"Rest a bit before heading out.",q:"Moose Easy Hotel Fa Ham Chiang Mai"},
 {day:1,slot:"Evening",time:"~6:15",name:"Kad Na Mor (CMU Market)",note:"Main event tonight. Local student market at CMU's front gate (กาดหน้ามอ): desserts, bubble tea, snacks, cheap clothes. About 20 min from the hotel. Parking about 20 baht.",cid:"16039942507088366045"},
 {day:1,slot:"Evening",time:"~7:45",name:"Kad Kongkao / Lanna Square",note:"Friday-only walking street, about 10 min from CMU. Crafts and snacks. Parking may be tight on the holiday.",cid:"1060688020538713953"},
 {day:1,slot:"Evening",time:"~8:30",name:"Chang Phueak (North Gate) Market",opt:1,note:"Late snack, 5 min from Kongkao. The stewed pork leg stall may be sold out by now.",cid:"8054357250613599001"},

 {day:2,slot:"Early markets",time:"7:00",name:"Jing Jai Market",note:"Weekend farmers' and craft market. Own car park. Grab breakfast here.",cid:"11511114691515616006"},
 {day:2,slot:"Early markets",time:"8:00",name:"Thanin Market (Siri Wattana)",note:"5 min away. Local cooked food and fruit.",cid:"5114455481968313788"},
 {day:2,slot:"Early markets",time:"9:00",name:"Warorot Market ★ Mark Wiens pick",note:"Mark Wiens: moo tod (fried pork) at Dam Rong (ดำรงค์), plus cab moo, nam prik noom and moo yor to take home. Food is on the lower floors. Try sour ma prang dipped in chili sauce outside.",cid:"2648256326189542464"},
 {day:2,slot:"Early markets",time:"9:45",name:"Ton Lam Yai Market",note:"Next door to Warorot: dried fruit, spices, flowers.",cid:"8774498114757061699"},
 {day:2,slot:"Early markets",time:"10:15",name:"Muang Mai Market",note:"Big wholesale fruit and veg market by the river, 5 min from Warorot. Cheap fresh fruit for the road.",q:"Muang Mai Market Chiang Mai"},
 {day:2,slot:"Early markets",time:"10:45",name:"Khao Soi Khun Yai ★ Mark Wiens pick",note:"His “best khao soi in Chiang Mai?” pick. Get the beef (khao soi neua). Taste first, then add the roasted chili. Open 10am–2pm, closed Sundays, so today only. Sri Poom Rd, north Old City. Thai-only sign, in front of Wat Kuan Kama.",q:"Khao Soi Khun Yai Chiang Mai"},
 {day:2,slot:"Early markets",time:"11:30",name:"Check out: Moose EASY Hotel",note:"Shower, pack and check out before 12:00.",q:"Moose Easy Hotel Fa Ham Chiang Mai"},
 {day:2,slot:"Afternoon",time:"12:30",name:"Huay Tung Tao Lake",note:"Relax in bamboo huts over the water with drinks and snacks, mountain views. You'll still be full from khao soi. About 25 min north. Small entry fee.",cid:"3473402653889272717"},
 {day:2,slot:"Afternoon",time:"2:15",name:"Tong Tem Toh ★ Mark Wiens pick",note:"His northern Thai feast spot on Nimman Soi 13. Late lunch: sai ua, crispy pork rinds, nam prik noom, grilled pork. Open 8am–11pm.",cid:"",q:"Tong Tem Toh Nimman Chiang Mai"},
 {day:2,slot:"Afternoon",time:"2:45",name:"Nimman Road + One Nimman",note:"Trendy street of cafés and small shops. One Nimman has air-con and a weekend craft market.",cid:"4179123163732524983"},
 {day:2,slot:"Afternoon",time:"3:15",name:"Ton Payom Market ★ Mark Wiens pick",note:"Behind Chiang Mai University. Mark Wiens says the sai ua (northern sausage) here beats Warorot. Northern snacks to take home. Closes about 5pm.",q:"Ton Payom Market Chiang Mai"},
 {day:2,slot:"Afternoon",time:"4:00",name:"Baan Kang Wat",note:"Artist village with craft shops, pottery and cafés in the trees. Open till 6pm.",cid:"6561582910531882655"},
 {day:2,slot:"Evening",time:"5:30",name:"Chiang Mai Gate Market",note:"Park nearby before 6pm. Cheap khao soi.",cid:"14501863873841167432"},
 {day:2,slot:"Evening",time:"6:30",name:"Wua Lai Saturday Walking Street",note:"Main event until about 11pm.",cid:"9528490394611933464"}
];
const R=(o,d,w)=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+encodeURIComponent(o)+"&destination="+encodeURIComponent(d)+(w&&w.length?"&waypoints="+encodeURIComponent(w.join("|")):"");
const HOTEL="Moose Easy Hotel Fa Ham Chiang Mai";
const ROUTES={
 1:[["Drive in","Hot Spring → Tha Phae Gate",R("Mae Kachan Hot Spring Wiang Pa Pao","Tha Phae Gate Chiang Mai",[])],
    ["To the hotel","Art in Paradise → Hotel",R("Art in Paradise Chiang Mai",HOTEL,[])],
    ["Evening markets","Hotel → Kad Na Mor → Kad Kongkao → Chang Phueak",R(HOTEL,"Chang Phueak Night Market Chiang Mai",["Kad Na Mor Chiang Mai University","Kad Kongkao Lanna Square Chiang Mai"])]],
 2:[["Morning markets","Jing Jai → Thanin → Warorot → Muang Mai",R(HOTEL,"Muang Mai Market Chiang Mai",["Jing Jai Market Chiang Mai","Thanin Market Chiang Mai","Warorot Market Chiang Mai"])],
    ["Midday","Muang Mai → Khao Soi Khun Yai → Hotel (check-out) → Huay Tung Tao",R("Muang Mai Market Chiang Mai","Huay Tung Tao Lake Chiang Mai",["Khao Soi Khun Yai Chiang Mai",HOTEL])],
    ["Afternoon","Tong Tem Toh / Nimman → Ton Payom → Baan Kang Wat",R("Huay Tung Tao Lake Chiang Mai","Baan Kang Wat Chiang Mai",["Tong Tem Toh Nimman Chiang Mai","Ton Payom Market Chiang Mai"])],
    ["Evening","Baan Kang Wat → Chiang Mai Gate (walk to Wua Lai)",R("Baan Kang Wat Chiang Mai","Chiang Mai Gate Market",[])]]
};
const gm=s=>s.cid?"https://maps.google.com/?cid="+s.cid:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.q);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let html="";
[[1,"Day 1 · Fri 23 Oct"],[2,"Day 2 · Sat 24 Oct"]].forEach(([d,label])=>{
  const stops=STOPS.filter(s=>s.day===d);
  html+=`<section><div class="dayhead"><h2>${label}</h2></div><p class="rtitle">Driving routes</p><div class="routes">`+ROUTES[d].map(([t,sub,u])=>`<a href="${u}" target="_blank" rel="noopener"><div>${t}<br><span>${sub}</span></div>Maps ↗</a>`).join("")+`</div>`;
  let slot="";
  stops.forEach(s=>{
    if(s.slot!==slot){ if(slot) html+="</ol>"; slot=s.slot; html+=`<p class="slot">${esc(slot)}</p><ol>`; }
    html+=`<li><span class="time">${s.time}</span><div class="body"><p class="name">${esc(s.name)}${s.opt?'<span class="opt">Optional</span>':''}</p><p class="note">${esc(s.note)}</p><a class="map" href="${gm(s)}" target="_blank" rel="noopener">Google Maps ↗</a></div></li>`;
  });
  html+="</ol></section>";
});
document.getElementById("days").innerHTML=html;
document.querySelector(".wrap").style.gap="22px";
</script>

</body>
</html>
