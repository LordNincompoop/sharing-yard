<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharing Yard</title>
<style>
  html,body{height:100%;margin:0;background:#12150E;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

/* ============================================================
   SHARING YARD
   Division by moving cars into groups with a crane.
   One screen, one Switch Pro controller, thirty students.
   ============================================================ */

const V = { w: 1600, h: 900 };
const C = {
  bg:        "#12150E",
  ink:       "#F1F0E6",
  dim:       "#8B9182",
  faint:     "#2A2F22",
  steel:     "#5E6B57",
  dividend:  "#63BADB",
  divisor:   "#E8B02A",
  quotient:  "#79C68C",
  remainder: "#E97050",
  car:       "#F1F0E6"
};
const FONT = '"Trebuchet MS","Segoe UI",system-ui,sans-serif';

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let scale = 1, offx = 0, offy = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  scale = Math.min(cv.width / V.w, cv.height / V.h);
  offx = (cv.width - V.w * scale) / 2;
  offy = (cv.height - V.h * scale) / 2;
}
addEventListener("resize", resize);
resize();

/* ---------------- audio ---------------- */
let ac = null;
function audioOn() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function blip(freq, dur, type, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.06, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
const SFX = {
  grab:  () => blip(330, 0.07, "square", 0.05),
  drop:  () => blip(200 + Math.random() * 30, 0.09, "square", 0.06),
  deny:  () => blip(110, 0.16, "sawtooth", 0.05),
  clatter: () => { blip(90, 0.20, "sawtooth", 0.07); setTimeout(() => blip(70, 0.16, "square", 0.05), 70); },
  thud:  () => blip(60, 0.14, "sine", 0.07),
  creak: () => blip(180 + Math.random() * 60, 0.05, "sawtooth", 0.03),
  tick:  () => blip(520, 0.04, "square", 0.035),
  good:  () => { blip(523, 0.12, "triangle", 0.09); setTimeout(() => blip(784, 0.24, "triangle", 0.09), 110); },
  bad:   () => blip(150, 0.30, "sawtooth", 0.05),
  spin:  () => blip(400 + Math.random() * 300, 0.03, "square", 0.03)
};

/* ---------------- input ----------------
   Switch Pro pad, reported by Windows as an Xbox pad: the two
   pairs of face buttons swap. The button PRINTED "A" (right)
   arrives as buttons[1]. Binding confirm to buttons[0] would
   bind the button printed B — cancel on every Nintendo console.
   So the first run asks which button is which.
----------------------------------------- */
/* Works for BOTH the mappings a Switch Pro Controller turns up with:
     - USB / Chrome "standard" mapping .. 0 bottom, 1 right, 2 left, 3 top
     - Bluetooth / Nintendo HID order ... 0 B, 1 A, 2 Y, 3 X
   In both, the button PRINTED "A" lands on index 1, so this default is
   right either way. The calibration below still runs, because everything
   else about a Bluetooth report can move. */
const DEFAULT_BIND = { A: 1, B: 0, X: 3, Y: 2 };

/* One remembered profile per controller, keyed by the id the browser
   reports. The same pad on USB and on Bluetooth reports two different
   ids, so each gets calibrated once and then remembered separately. */
let profiles = (function () {
  try {
    const raw = localStorage.getItem("sharingyard.pads");
    if (raw) { const p = JSON.parse(raw); if (p && typeof p === "object") return p; }
  } catch (e) {}
  return {};
})();
let bind = null, padId = "", padMapping = "", padAxes = 0, padButtons = 0;
function persistProfiles() {
  try { localStorage.setItem("sharingyard.pads", JSON.stringify(profiles)); } catch (e) {}
}
function saveBind(b) { profiles[padId] = b; persistProfiles(); }

/* Direction reading has to cope with three shapes of report: the standard
   mapping's d-pad buttons, Nintendo's HID d-pad buttons, and a hat packed
   into a spare axis. The left stick is read regardless, and on this game
   the stick alone can do everything - so a d-pad we fail to recognise
   costs nothing. */
function readDirs(gp) {
  const b = gp.buttons, ax = gp.axes;
  const on = i => b[i] && b[i].pressed;
  let u = 0, d = 0, l = 0, r = 0;

  if (gp.mapping === "standard") {
    if (on(12)) u = 1;
    if (on(13)) d = 1;
    if (on(14)) l = 1;
    if (on(15)) r = 1;
  } else {
    if (on(14)) u = 1;          // Nintendo HID order
    if (on(15)) d = 1;
    if (on(16)) l = 1;
    if (on(17)) r = 1;
  }

  /* Some Bluetooth reports pack the d-pad into a hat on axes[9]: eight
     positions spread across -1..1, resting somewhere above 1. Only axes[9]
     on a ten-axis report is treated this way, and the value has to land
     close to one of the eight real positions — a stick sitting at 0.00 is
     otherwise half a step from "down" and would drive the crane by itself. */
  if (ax.length >= 10) {
    const h = ax[9];
    if (h != null && h >= -1.001 && h <= 1.001) {
      const pos = (h + 1) * 3.5;                 // 0 = up, then clockwise
      const k = Math.round(pos);
      if (k >= 0 && k <= 7 && Math.abs(pos - k) < 0.22) {
        if (k === 7 || k === 0 || k === 1) u = 1;
        if (k === 1 || k === 2 || k === 3) r = 1;
        if (k === 3 || k === 4 || k === 5) d = 1;
        if (k === 5 || k === 6 || k === 7) l = 1;
      }
    }
  }
  return { u: u, d: d, l: l, r: r };
}

const IN = { A: 0, B: 0, X: 0, Y: 0, L: 0, R: 0, left: 0, right: 0, up: 0, down: 0, plus: 0, select: 0 };
const WAS = Object.assign({}, IN);
const KEY = {};
let padName = "", lastRawPress = -1, stick = 0, stickY = 0;
let diagPad = null, showDiag = false;

function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (let i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { gp = pads[i]; break; }
  padName = gp ? gp.id : "";
  if (gp) {
    if (gp.id !== padId) {                 // a different pad, or the same one
      padId = gp.id;                       // reconnected over another transport
      bind = profiles[padId] || null;
    }
    padMapping = gp.mapping || "non-standard";
    padAxes = gp.axes.length;
    padButtons = gp.buttons.length;
  }

  for (const k in IN) WAS[k] = IN[k];
  for (const k in IN) IN[k] = 0;
  stick = 0; stickY = 0;

  if (gp) {
    const b = gp.buttons, bd = bind || DEFAULT_BIND;
    const down = i => i != null && b[i] && b[i].pressed;
    lastRawPress = -1;
    for (let i = 0; i < b.length; i++) if (b[i] && b[i].pressed) { lastRawPress = i; break; }
    if (down(bd.A)) IN.A = 1;
    if (down(bd.B)) IN.B = 1;
    if (down(bd.X)) IN.X = 1;
    if (down(bd.Y)) IN.Y = 1;
    if (down(4) || down(6)) IN.L = 1;
    if (down(5) || down(7)) IN.R = 1;
    if (down(8)) IN.select = 1;   // the - button, Switch's select
    if (down(9)) IN.plus = 1;
    const dirs = readDirs(gp);
    if (dirs.l) IN.left = 1;
    if (dirs.r) IN.right = 1;
    if (dirs.u) IN.up = 1;
    if (dirs.d) IN.down = 1;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    stick = Math.abs(ax) > 0.18 ? ax : 0;
    stickY = Math.abs(ay) > 0.18 ? ay : 0;
    if (ax < -0.55) IN.left = 1;
    if (ax > 0.55) IN.right = 1;
    if (ay < -0.55) IN.up = 1;
    if (ay > 0.55) IN.down = 1;
  } else {
    lastRawPress = -1;
  }

  // keyboard fallback, always live
  if (KEY.Enter || KEY[" "]) IN.A = 1;
  if (KEY.Backspace) IN.B = 1;
  if (KEY.p) IN.X = 1;
  if (KEY.r) IN.Y = 1;
  if (KEY['-']) IN.select = 1;
  diagPad = gp;
  if (KEY.ArrowLeft) { IN.left = 1; stick = -1; }
  if (KEY.ArrowRight) { IN.right = 1; stick = 1; }
  if (KEY.ArrowUp) { IN.up = 1; stickY = -1; }
  if (KEY.ArrowDown) { IN.down = 1; stickY = 1; }
}
const hit = k => IN[k] && !WAS[k];

addEventListener("keydown", e => {
  if ([" ", "Enter", "Backspace", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
  KEY[e.key.length === 1 ? e.key.toLowerCase() : e.key] = 1;
  audioOn();
});
addEventListener("keyup", e => { KEY[e.key.length === 1 ? e.key.toLowerCase() : e.key] = 0; });
addEventListener("pointerdown", audioOn);
addEventListener("gamepadconnected", audioOn);

let repT = 0;
function heldDir(dt) {
  const dir = IN.right ? 1 : (IN.left ? -1 : 0);
  if (!dir) { repT = 0; return 0; }
  if (hit("right") || hit("left")) { repT = 0.40; return dir; }
  repT -= dt;
  if (repT <= 0) { repT = 0.12; return dir; }
  return 0;
}

/* ---------------- draw helpers ---------------- */
function text(str, x, y, size, color, align, weight, spacing) {
  ctx.font = (weight || "700") + " " + size + "px " + FONT;
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  if (spacing) {
    let total = 0;
    for (const ch of str) total += ctx.measureText(ch).width + spacing;
    total -= spacing;
    let cx = align === "center" ? x - total / 2 : (align === "right" ? x - total : x);
    ctx.textAlign = "left";
    for (const ch of str) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacing; }
  } else {
    ctx.textAlign = align || "center";
    ctx.fillText(str, x, y);
  }
}
function circleOutline(x, y, r, color, w, dash) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawCar(x, y, w, color) {
  const h = w * 0.36;
  ctx.fillStyle = color;
  const r = h * 0.34, bx = x - w / 2, by = y - h / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.arcTo(bx + w, by, bx + w, by + h, r);
  ctx.arcTo(bx + w, by + h, bx, by + h, r);
  ctx.arcTo(bx, by + h, bx, by, r);
  ctx.arcTo(bx, by, bx + w, by, r);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.24, y - h / 2);
  ctx.lineTo(x - w * 0.12, y - h / 2 - w * 0.20);
  ctx.lineTo(x + w * 0.10, y - h / 2 - w * 0.20);
  ctx.lineTo(x + w * 0.22, y - h / 2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x - w * 0.26, y + h / 2, w * 0.115, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.26, y + h / 2, w * 0.115, 0, Math.PI * 2); ctx.fill();
}

/* rows, never heaps */
function gridSlots(n, cx, cy, r) {
  if (n <= 0) return [];
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const cw = (r * 1.42) / cols, ch = (r * 1.42) / rows;
  const carW = Math.min(cw * 0.92, ch * 1.6);
  const out = [];
  for (let i = 0; i < n; i++) {
    const rIdx = Math.floor(i / cols);
    const inRow = Math.min(cols, n - rIdx * cols);
    const cIdx = i - rIdx * cols;
    out.push({
      x: cx + (cIdx - (inRow - 1) / 2) * cw,
      y: cy + (rIdx - (rows - 1) / 2) * ch,
      w: carW
    });
  }
  return out;
}

/* ---------------- state ---------------- */
const St = { BOOT: "boot", CAL_B: "calB", SETUP: "setup", PICKER: "picker", MOVE: "move", ANSWER: "answer", RESULT: "result" };
let state = St.BOOT;
let t = 0;

const scores = {};
let student = 1, solved = 0, attempts = 0;
let reelPos = 0, reelVel = 0, reelSpinning = false, reelLanded = false, reelTick = 0;

let Q = null, cars = [], orderCounter = 0;
let answerOpts = [], answerSel = 0;
let result = null, resultT = 0, countUp = -1, countT = 0;
let fairNag = 0;

/* car.g :  -1 pile  |  -2 in the claw  |  -3 falling  |  0..n circle index */
const crane = { x: 800, y: 300, carry: null, dip: -1, dipZone: null, resolved: false, bump: 0 };

const PILE = { x: 195, y: 520, r: 116 };
const BAND = { x0: 386, x1: 1430, y: 520 };
const RAIL_Y = 206;
/* the hoist: how far down the cable the claw hangs, driven by the stick */
const CLAW_HIGH = 238, CLAW_LOW = 368;
const GROUND = 700;

/* --- for fun: gulls cross the yard at their own heights --- */
const GULL_TOP = 306, GULL_BOT = 330;
let gulls = [];
let carryT = 0;                 // hold a car too long and it slips
const CARRY_MAX = 6.5;
let shake = 0, slipFlash = 0;

/* how many problems each student gets before the crane moves on.
   The teacher sets this on the setup screen; it is remembered. */
let probsPerStudent = (function () {
  try {
    const v = parseInt(localStorage.getItem("sharingyard.probs"), 10);
    if (v >= 1 && v <= 10) return v;
  } catch (e) {}
  return 3;
})();
function saveProbs() { try { localStorage.setItem("sharingyard.probs", String(probsPerStudent)); } catch (e) {} }
let probIdx = 0;
let setupSel = 0;
let toastT = 0, toastMsg = "";
let diagLatch = false;

function spawnGulls() {
  gulls = [];
  const n = 1 + Math.min(2, Math.floor(solved / 4));
  for (let i = 0; i < n; i++) {
    gulls.push({
      x: BAND.x0 + 40 + Math.random() * (BAND.x1 - BAND.x0 - 40),
      // each gull keeps its own altitude, so you go over one and under the next
      y: GULL_TOP + (n === 1 ? Math.random() : i / (n - 1)) * (GULL_BOT - GULL_TOP),
      vx: (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 110),
      bob: Math.random() * 6.28,
      flap: Math.random() * 6.28
    });
  }
}

/* Difficulty climbs on questions attempted as well as solved, so a class
   that is finding it hard still moves on instead of being stuck on the
   smallest numbers all lesson. */
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
let recent = [];              // last few questions, so they do not repeat

function pickQuestion() {
  const lvl = solved + Math.floor(attempts / 3);
  let maxCircles, maxPer, maxTotal;
  if (lvl < 3)       { maxCircles = 4; maxPer = 4;  maxTotal = 10; }
  else if (lvl < 8)  { maxCircles = 5; maxPer = 6;  maxTotal = 16; }
  else if (lvl < 15) { maxCircles = 6; maxPer = 8;  maxTotal = 22; }
  else               { maxCircles = 6; maxPer = 10; maxTotal = 24; }

  for (let tries = 0; tries < 60; tries++) {
    const circles = rnd(2, maxCircles);
    const perCircle = rnd(lvl < 3 ? 1 : 2, maxPer);
    const total = circles * perCircle;
    if (total > maxTotal || total < 2) continue;

    const mode = (solved < 2 || Math.random() < 0.5) ? "share" : "group";
    // in grouping the answer IS the number of circles, so keep that drawable
    if (mode === "group" && circles > 6) continue;

    const key = mode + ":" + total + ":" + (mode === "share" ? circles : perCircle);
    if (recent.indexOf(key) !== -1) continue;

    recent.push(key);
    if (recent.length > 5) recent.shift();
    return mode === "share"
      ? { total, mode, divisor: circles, circles, perCircle, answer: perCircle }
      : { total, mode, divisor: perCircle, circles, perCircle, answer: circles };
  }
  // fallback that always works
  return { total: 6, mode: "share", divisor: 3, circles: 3, perCircle: 2, answer: 2 };
}

function newQuestion() {
  Q = pickQuestion();

  cars = [];
  for (let i = 0; i < Q.total; i++) cars.push({ g: -1, o: 0, x: PILE.x, y: PILE.y, w: 40, vy: 0, seeded: false });
  orderCounter = 0;
  crane.carry = null; crane.dip = -1; crane.x = PILE.x; crane.y = 300;
  carryT = 0; shake = 0; slipFlash = 0;
  spawnGulls();

  const top = Math.min(12, Math.max(8, Q.answer + 3));
  answerOpts = [];
  for (let i = 1; i <= top; i++) answerOpts.push(i);
  answerSel = Math.max(0, Math.min(answerOpts.length - 1, Math.floor(top / 2) - 1));
  result = null; countUp = -1; fairNag = 0;
}

const inCircle = i => cars.reduce((n, c) => n + (c.g === i ? 1 : 0), 0);
const pileCount = () => cars.reduce((n, c) => n + (c.g === -1 ? 1 : 0), 0);

function openCircles() {
  if (Q.mode === "share") return Q.circles;
  // every circle that already holds a car stays open...
  let highest = 0;
  for (const c of cars) if (c.g >= 0 && c.g + 1 > highest) highest = c.g + 1;
  let open = Math.max(1, highest);
  // ...and a fresh one opens once they are all full and cars are still out
  const outside = cars.reduce((n, c) => n + (c.g < 0 ? 1 : 0), 0);
  let allFull = true;
  for (let i = 0; i < open; i++) if (inCircle(i) < Q.perCircle) { allFull = false; break; }
  if (allFull && outside > 0 && open < Q.circles) open++;
  return open;
}

function circleLayout() {
  const n = Q ? openCircles() : 1;
  const slot = (BAND.x1 - BAND.x0) / n;
  const r = Math.min(112, slot / 2 - 16);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: BAND.x0 + slot * (i + 0.5), y: BAND.y, r });
  return out;
}

function zoneAt(x, lay) {
  if (Math.abs(x - PILE.x) <= PILE.r + 8) return { type: "pile" };
  for (let i = 0; i < lay.length; i++) if (Math.abs(x - lay[i].x) <= lay[i].r + 8) return { type: "circle", i };
  return null;
}

function currentClawY(lay) {
  const z = zoneAt(crane.x, lay);
  const deepY = z ? (z.type === "pile" ? PILE.y - 46 : lay[z.i].y - 46) : crane.y;
  const dipAmt = crane.dip >= 0 ? Math.sin(crane.dip * Math.PI) : 0;
  return crane.y + (deepY - crane.y) * dipAmt;
}

/* the car slips out of the claw and falls to the yard floor */
function dropCarry() {
  const c = crane.carry;
  if (!c) return;
  c.g = -3; c.vy = 0; c.o = 0;
  crane.carry = null; crane.dip = -1; crane.resolved = true;
  carryT = 0; shake = 1; slipFlash = 1;
  SFX.clatter();
}

const anyFalling = () => cars.some(c => c.g === -3);

function sharesEqual() {
  const n = openCircles();
  const first = inCircle(0);
  if (first === 0) return false;
  for (let i = 1; i < n; i++) if (inCircle(i) !== first) return false;
  return true;
}

/* ---------------- update ---------------- */
function update(dt) {
  t += dt;
  pollPad();
  if (crane.bump > 0) crane.bump = Math.max(0, crane.bump - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (slipFlash > 0) slipFlash = Math.max(0, slipFlash - dt * 0.8);
  if (toastT > 0) toastT = Math.max(0, toastT - dt);
  if (KEY.d && !diagLatch) { showDiag = !showDiag; diagLatch = true; }
  if (!KEY.d) diagLatch = false;

  /* the - button (select) adjusts the turn length at any time, mid-lesson */
  if (hit("select") && state !== St.BOOT && state !== St.CAL_B) {
    probsPerStudent = probsPerStudent % 10 + 1;
    saveProbs();
    if (state === St.SETUP) setupSel = probsPerStudent - 1;
    toastMsg = probsPerStudent === 1 ? "1 PROBLEM EACH" : probsPerStudent + " PROBLEMS EACH";
    toastT = 1.8;
    SFX.tick();
  }

  if (state === St.BOOT) {
    if (!bind) {
      if (lastRawPress >= 0) { audioOn(); bind = { A: lastRawPress }; state = St.CAL_B; SFX.tick(); }
      else if (KEY.Enter) { audioOn(); bind = Object.assign({}, DEFAULT_BIND); saveBind(bind); startSetup(); }
    } else if (hit("A")) {
      audioOn();
      if (KEY.s) {                       // hold S: forget this pad and set it up again
        delete profiles[padId];
        persistProfiles();
        bind = null;                     // the next press becomes the new "A"
        SFX.tick();
        return;
      }
      startSetup();
    }
    else if (KEY.s && lastRawPress < 0 && KEY.Enter) { bind = null; }
    return;
  }

  if (state === St.CAL_B) {
    if (lastRawPress >= 0 && lastRawPress !== bind.A) {
      bind.B = lastRawPress;
      if (bind.A === 1) { bind.X = 3; bind.Y = 2; } else { bind.X = 2; bind.Y = 3; }
      saveBind(bind); SFX.tick(); startSetup();
    } else if (KEY.Enter) { bind = Object.assign({}, DEFAULT_BIND); saveBind(bind); startSetup(); }
    return;
  }

  if (state === St.SETUP) {
    const d = heldDir(dt);
    if (d) { setupSel = Math.max(0, Math.min(9, setupSel + d)); SFX.tick(); }
    if (hit("A")) { probsPerStudent = setupSel + 1; saveProbs(); SFX.good(); startPicker(); }
    return;
  }

  if (state === St.PICKER) {
    if (reelSpinning) {
      reelPos += reelVel * dt;
      reelVel *= Math.pow(0.22, dt);
      reelTick -= dt;
      if (reelTick <= 0) { SFX.spin(); reelTick = 0.06; }
      if (reelVel < 1.2) {
        reelVel = 0; reelSpinning = false; reelLanded = true;
        reelPos = Math.round(reelPos);
        student = ((Math.round(reelPos) % 30) + 30) % 30 + 1;
        SFX.good();
      }
    } else if (!reelLanded) {
      if (hit("plus")) { startSetup(); return; }
      if (hit("A")) { reelSpinning = true; reelVel = 32 + Math.random() * 24; SFX.tick(); }
    } else {
      if (hit("plus")) { startSetup(); return; }
      if (hit("A")) { newQuestion(); state = St.MOVE; }
      if (hit("Y")) reelLanded = false;
    }
    return;
  }

  if (state === St.MOVE) {
    const lay = circleLayout();

    // drive the crane
    let dir = stick;
    if (!dir) dir = IN.right ? 1 : (IN.left ? -1 : 0);
    crane.x += dir * 780 * dt;
    const minX = PILE.x, maxX = lay.length ? lay[lay.length - 1].x : BAND.x1;
    crane.x = Math.max(minX, Math.min(maxX, crane.x));

    // the hoist: push the stick up or down to shorten or pay out the cable
    let vdir = stickY;
    if (!vdir) vdir = IN.down ? 1 : (IN.up ? -1 : 0);
    crane.y += vdir * 580 * dt;
    crane.y = Math.max(CLAW_HIGH, Math.min(CLAW_LOW, crane.y));

    // grab / drop
    if (hit("A") && crane.dip < 0) {
      const z = zoneAt(crane.x, lay);
      if (z) { crane.dip = 0; crane.dipZone = z; crane.resolved = false; }
      else SFX.deny();
    }
    if (crane.dip >= 0) {
      crane.dip += dt / 0.30;
      if (!crane.resolved && crane.dip >= 0.5) { crane.resolved = true; resolveDip(); }
      if (crane.dip >= 1) crane.dip = -1;
    }

    if (hit("Y")) {                      // put everything back
      cars.forEach(c => { c.g = -1; c.o = 0; c.vy = 0; });
      crane.carry = null; carryT = 0; orderCounter = 0; SFX.deny();
    }

    /* ---- gulls cross the yard ---- */
    for (const b of gulls) {
      b.x += b.vx * dt;
      b.bob += dt * 1.8;
      b.flap += dt * (2.6 + Math.abs(b.vx) * 0.004);
      // gulls never reach the pile — picking a car up is always safe
      if (b.x < BAND.x0 - 34) { b.x = BAND.x0 - 34; b.vx = Math.abs(b.vx); }
      if (b.x > BAND.x1 + 30) { b.x = BAND.x1 + 30; b.vx = -Math.abs(b.vx); }
    }

    /* ---- carrying: the grip timer ---- */
    if (crane.carry) {
      carryT += dt;
      if (carryT > CARRY_MAX - 2 && Math.random() < dt * 6) SFX.creak();
      if (carryT >= CARRY_MAX) dropCarry();
    }
    /* only the car itself can be clipped — never the cable, which
       necessarily spans the whole lane and would be impossible to dodge */
    if (crane.carry) {
      const cy = currentClawY(lay);
      const cx0 = crane.x - 31, cx1 = crane.x + 31, cy0 = cy + 14, cy1 = cy + 46;
      for (const b of gulls) {
        const by = b.y + Math.sin(b.bob) * 4;
        if (!(cx1 < b.x - 22 || cx0 > b.x + 22 || cy1 < by - 12 || cy0 > by + 12)) { dropCarry(); break; }
      }
    }

    /* ---- cars that slipped fall to the floor and roll back to the pile ---- */
    for (const c of cars) {
      if (c.g !== -3) continue;
      c.vy += 2300 * dt;
      c.y += c.vy * dt;
      if (c.y >= GROUND) { c.y = GROUND; c.vy = 0; c.g = -1; SFX.thud(); }
    }

    // done?
    if (pileCount() === 0 && !crane.carry && crane.dip < 0 && !anyFalling()) {
      if (Q.mode === "group" || sharesEqual()) { state = St.ANSWER; SFX.tick(); }
      else fairNag = Math.min(1, fairNag + dt * 3);
    } else if (fairNag > 0) fairNag = Math.max(0, fairNag - dt * 3);
    return;
  }

  if (state === St.ANSWER) {
    const d = heldDir(dt);
    if (d) { answerSel = Math.max(0, Math.min(answerOpts.length - 1, answerSel + d)); SFX.tick(); }
    if (hit("B")) { state = St.MOVE; return; }
    if (hit("A")) {
      const picked = answerOpts[answerSel];
      const ok = picked === Q.answer;
      result = { ok, picked, correct: Q.answer };
      resultT = 0;
      attempts++;
      if (ok) { solved++; scores[student] = (scores[student] || 0) + 10; SFX.good(); }
      else { SFX.bad(); countUp = 0; countT = 0; }
      state = St.RESULT;
    }
    return;
  }

  if (state === St.RESULT) {
    resultT += dt;
    if (!result.ok && countUp >= 0) {
      countT += dt;
      if (countT > 0.40) {
        countT = 0;
        const target = Q.mode === "share" ? inCircle(0) : openCircles();
        if (countUp < target) { countUp++; SFX.tick(); }
      }
    }
    if (resultT > 0.7 && hit("A")) {
      probIdx++;
      if (probIdx >= probsPerStudent) startPicker();
      else { newQuestion(); state = St.MOVE; }
    }
    if (resultT > 0.7 && hit("B") && !result.ok) { state = St.ANSWER; result = null; countUp = -1; }
    return;
  }
}

function resolveDip() {
  const lay = circleLayout();
  const z = crane.dipZone;
  if (!z) return;

  if (crane.carry) {
    if (z.type === "pile") { crane.carry.g = -1; crane.carry.o = 0; crane.carry = null; SFX.drop(); return; }
    if (Q.mode === "group" && inCircle(z.i) >= Q.perCircle) { SFX.deny(); crane.bump = 1; return; }
    crane.carry.g = z.i; crane.carry.o = ++orderCounter; crane.carry = null; SFX.drop();
    return;
  }

  // grab the car nearest the claw in this zone
  const pool = cars.filter(c => z.type === "pile" ? c.g === -1 : c.g === z.i);
  if (!pool.length) { SFX.deny(); return; }
  let best = pool[0], bd = Infinity;
  for (const c of pool) { const d = Math.abs(c.x - crane.x) + Math.abs(c.y - PILE.y) * 0.2; if (d < bd) { bd = d; best = c; } }
  best.g = -2; best.o = 0; best.vy = 0;
  crane.carry = best;
  carryT = 0;
  SFX.grab();
}

function startSetup() {
  state = St.SETUP;
  setupSel = probsPerStudent - 1;
}

function startPicker() {
  state = St.PICKER;

/* ---------------- draw ---------------- */
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = shake > 0 ? shake * 9 : 0;
  ctx.setTransform(scale, 0, 0, scale,
    offx + (sh ? (Math.random() - 0.5) * sh * scale : 0),
    offy + (sh ? (Math.random() - 0.5) * sh * scale : 0));

  if (state === St.BOOT) drawBoot();
  else if (state === St.CAL_B) drawCalB();
  else if (state === St.SETUP) drawSetup();
  else if (state === St.PICKER) drawPicker();
  else drawGame();

  if (showDiag) drawDiag();

  if (toastT > 0) {
    const a = Math.min(1, toastT / 0.4);
    ctx.globalAlpha = a;
    ctx.fillStyle = C.divisor;
    const w = 420, h = 62;

}

function drawGull(x, y, flap, dir) {
  const f = Math.sin(flap);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir < 0 ? -1 : 1, 1);

  // far wing, behind the body
  ctx.fillStyle = "#8794A0";
  ctx.beginPath();
  ctx.moveTo(-2, -2);
  ctx.quadraticCurveTo(-14, -6 + f * 16, -26, 2 + f * 20);
  ctx.quadraticCurveTo(-10, 2 + f * 6, -2, 2);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#EFEDE0";
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 9, 0, 0, Math.PI * 2); ctx.fill();   // body
  ctx.beginPath(); ctx.moveTo(-14, -3); ctx.lineTo(-30, -10); ctx.lineTo(-27, 2);
  ctx.closePath(); ctx.fill();                                                // tail
  ctx.beginPath(); ctx.arc(15, -7, 8, 0, Math.PI * 2); ctx.fill();            // head

  ctx.fillStyle = "#E8B02A";                                                  // beak
  ctx.beginPath(); ctx.moveTo(21, -9); ctx.lineTo(33, -6); ctx.lineTo(21, -3);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#12150E";                                                  // eye
  ctx.beginPath(); ctx.arc(17, -9, 1.9, 0, Math.PI * 2); ctx.fill();

  // near wing, over the body
  ctx.fillStyle = "#C9D2DA";
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.quadraticCurveTo(-10, -10 - f * 22, -20, -6 - f * 28);
  ctx.quadraticCurveTo(-6, 0 - f * 8, 0, 1);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

function drawCrane(lay) {
  // rail
  ctx.strokeStyle = C.steel; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(PILE.x - 60, RAIL_Y); ctx.lineTo(BAND.x1 + 40, RAIL_Y); ctx.stroke();
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(PILE.x - 60, RAIL_Y - 22); ctx.lineTo(PILE.x - 60, RAIL_Y + 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(BAND.x1 + 40, RAIL_Y - 22); ctx.lineTo(BAND.x1 + 40, RAIL_Y + 16); ctx.stroke();

  const z = zoneAt(crane.x, lay);
  const clawY = currentClawY(lay) + (crane.bump > 0 ? Math.sin(t * 40) * 6 * crane.bump : 0);

  // trolley
  ctx.fillStyle = C.steel;
  roundRect(crane.x - 34, RAIL_Y - 16, 68, 30, 6); ctx.fill();
  // cable
  ctx.strokeStyle = C.steel; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(crane.x, RAIL_Y + 8); ctx.lineTo(crane.x, clawY - 22); ctx.stroke();

  // claw prongs — open when empty, closed when carrying
  const open = crane.carry ? 10 : 22;
  ctx.strokeStyle = crane.carry ? C.divisor : C.ink;
  ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(crane.x - 24, clawY - 22); ctx.lineTo(crane.x, clawY - 6); ctx.lineTo(crane.x + 24, clawY - 22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(crane.x - open, clawY - 8); ctx.lineTo(crane.x - open - 4, clawY + 16);
  ctx.moveTo(crane.x + open, clawY - 8); ctx.lineTo(crane.x + open + 4, clawY + 16);
  ctx.stroke();
  ctx.lineCap = "butt";

  if (crane.carry) {
    // the grip slips: the longer you hold it, the more the car swings
    const left = Math.max(0, 1 - carryT / CARRY_MAX);
    const panic = left < 0.32 ? (0.32 - left) / 0.32 : 0;
    crane.carry.x = crane.x + Math.sin(t * 19) * 7 * panic;
    crane.carry.y = clawY + 30;
    crane.carry.w = 62;

    // grip meter on the trolley
    const mw = 66;
    ctx.fillStyle = C.faint;
    roundRect(crane.x - mw / 2, RAIL_Y - 34, mw, 9, 4); ctx.fill();
    ctx.fillStyle = left > 0.32 ? C.quotient : C.remainder;
    roundRect(crane.x - mw / 2, RAIL_Y - 34, mw * left, 9, 4); ctx.fill();
  }

  // highlight the zone under the claw
  if (z && state === St.MOVE) {
    const hx = z.type === "pile" ? PILE.x : lay[z.i].x;
    const hy = z.type === "pile" ? PILE.y : lay[z.i].y;
    const hr = (z.type === "pile" ? PILE.r : lay[z.i].r) + 16;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 4);
    circleOutline(hx, hy, hr, C.divisor, 4, [10, 10]);
    ctx.restore();
  }
}

function drawGame() {
  const lay = circleLayout();

  // targets
  const pile = cars.filter(c => c.g === -1);
  const pslots = gridSlots(pile.length, PILE.x, PILE.y, PILE.r);
  pile.forEach((c, i) => ease(c, pslots[i]));
  for (let g = 0; g < lay.length; g++) {
    const inG = cars.filter(c => c.g === g).sort((a, b) => a.o - b.o);
    const sl = gridSlots(inG.length, lay[g].x, lay[g].y, lay[g].r);
    inG.forEach((c, i) => ease(c, sl[i]));
  }

  /* the whole sum across the top, answer and all */
  const reveal = state === St.RESULT && (result.ok || resultT > 2.4);
  const sTotal = String(Q.total), sDiv = String(Q.divisor);
  const sAns = reveal ? String(Q.answer)
             : ((state === St.ANSWER || state === St.RESULT) ? String(answerOpts[answerSel]) : "?");
  ctx.font = "800 100px " + FONT;
  const wT = ctx.measureText(sTotal).width, wD = ctx.measureText(sDiv).width,
        wA = ctx.measureText(sAns).width;
  ctx.font = "800 80px " + FONT;
  const wO = ctx.measureText("  ÷  ").width, wE = ctx.measureText("  =  ").width;
  let ex = V.w / 2 - (wT + wO + wD + wE + wA) / 2;

  text(sTotal, ex + wT / 2, 92, 100, C.dividend, "center", "800");
  text("DIVIDEND", ex + wT / 2, 152, 19, C.dividend, "center", "700", 3);
  ex += wT;
  text("÷", ex + wO / 2, 92, 80, C.dim, "center", "800");
  ex += wO;
  text(sDiv, ex + wD / 2, 92, 100, C.divisor, "center", "800");
  text("DIVISOR", ex + wD / 2, 152, 19, C.divisor, "center", "700", 3);
  text(Q.mode === "share" ? "how many circles" : "how many in each circle",
       ex + wD / 2, 176, 17, C.dim, "center", "600");
  ex += wD;
  text("=", ex + wE / 2, 92, 80, C.dim, "center", "800");
  ex += wE;
  const ansCol = reveal ? C.quotient
               : (state === St.RESULT ? C.remainder
               : (state === St.ANSWER ? C.ink : C.faint));
  text(sAns, ex + wA / 2, 92, 100, ansCol, "center", "800");
  text("QUOTIENT", ex + wA / 2, 152, 19, reveal ? C.quotient : C.dim, "center", "700", 3);

  /* pile */
  const empty = pileCount() === 0;
  circleOutline(PILE.x, PILE.y, PILE.r, C.dividend, empty ? 4 : 6, [14, 12]);
  if (empty) text("empty", PILE.x, PILE.y, 24, C.dividend, "center", "600");
  text("THE PILE", PILE.x, PILE.y + PILE.r + 38, 19, C.dividend, "center", "700", 3);

  /* circles */
  const settled = empty && !crane.carry;
  for (let i = 0; i < lay.length; i++) {
    const L = lay[i];
    let col = Q.mode === "share" ? C.divisor : C.steel, w = 6;
    if (Q.mode === "group" && inCircle(i) >= Q.perCircle) { col = C.quotient; w = 7; }
    if (settled && state !== St.MOVE) { col = C.quotient; w = 8; }
    if (settled && state === St.MOVE && fairNag > 0.2 && Q.mode === "share" && inCircle(i) !== inCircle(0)) col = C.remainder;
    if (state === St.RESULT && !result.ok && i === 0) { col = C.remainder; w = 9; }
    circleOutline(L.x, L.y, L.r, col, w);
  }

  /* cars */
  for (const c of cars) if (c.g !== -2) drawCar(c.x, c.y, c.w || 40, C.car);

  /* crane above everything except the carried car */
  if (state === St.MOVE) drawCrane(lay);
  if (crane.carry) drawCar(crane.carry.x, crane.carry.y, crane.carry.w, C.divisor);

  /* gulls fly in front, so what they clip is never in doubt */
  if (state === St.MOVE) for (const b of gulls) drawGull(b.x, b.y + Math.sin(b.bob) * 4, b.flap, b.vx);

  if (slipFlash > 0.02) {
    ctx.globalAlpha = Math.min(1, slipFlash);
    text("DROPPED IT!", V.w / 2, 252, 46, C.remainder, "center", "800", 6);
    ctx.globalAlpha = 1;
  }

  /* counts, only when they are the point */
  if (settled && state === St.MOVE && fairNag > 0.2 && Q.mode === "share") {
    for (let i = 0; i < lay.length; i++) {
      const n = inCircle(i);
      text(String(n), lay[i].x, lay[i].y + lay[i].r + 34, 32,
           n === inCircle(0) ? C.dim : C.remainder, "center", "800");
    }
    ctx.globalAlpha = fairNag;
    text("every circle needs the same number", V.w / 2, 726, 30, C.remainder, "center", "700", 2);
    ctx.globalAlpha = 1;
  }

  /* brace under the row */
  if (lay.length && !(settled && state === St.MOVE && fairNag > 0.2)) {
    const x0 = lay[0].x - lay[0].r, x1 = lay[lay.length - 1].x + lay[lay.length - 1].r;
    const by = BAND.y + lay[0].r + 28;
    ctx.strokeStyle = Q.mode === "share" ? C.divisor : C.quotient;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x0, by); ctx.lineTo(x0, by + 12); ctx.lineTo(x1, by + 12); ctx.lineTo(x1, by);
    ctx.stroke();
    text(lay.length + (lay.length === 1 ? " circle" : " circles"), (x0 + x1) / 2, by + 42, 22,
         Q.mode === "share" ? C.divisor : C.quotient, "center", "700", 2);
  }

  /* counting overlay after a wrong answer */
  if (state === St.RESULT && !result.ok && countUp > 0) {
    if (Q.mode === "share") {
      const inG = cars.filter(c => c.g === 0).sort((a, b) => a.o - b.o);
      for (let i = 0; i < Math.min(countUp, inG.length); i++) {
        const c = inG[i];
        ctx.fillStyle = C.remainder;
        ctx.beginPath(); ctx.arc(c.x, c.y - c.w * 0.55, 15, 0, Math.PI * 2); ctx.fill();
        text(String(i + 1), c.x, c.y - c.w * 0.55 + 1, 18, C.bg, "center", "800");
      }
    } else {
      for (let i = 0; i < Math.min(countUp, lay.length); i++) {
        ctx.fillStyle = C.remainder;
        ctx.beginPath(); ctx.arc(lay[i].x, lay[i].y - lay[i].r - 26, 19, 0, Math.PI * 2); ctx.fill();
        text(String(i + 1), lay[i].x, lay[i].y - lay[i].r - 25, 22, C.bg, "center", "800");
      }
    }
  }

  /* answer strip */
  if (state === St.ANSWER || state === St.RESULT) {
    const n = answerOpts.length, bw = 82, gap = 12;
    const sx = V.w / 2 - (n * bw + (n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) {
      const x = sx + i * (bw + gap), y = 758;
      if (i === answerSel) {
        ctx.fillStyle = state === St.RESULT ? (result.ok ? C.quotient : C.remainder) : C.ink;
        roundRect(x - 4, y - 4, bw + 8, 74, 10); ctx.fill();
        text(String(answerOpts[i]), x + bw / 2, y + 33, 42, C.bg, "center", "800");
      } else {
        ctx.strokeStyle = C.faint; ctx.lineWidth = 3;
        roundRect(x, y, bw, 66, 8); ctx.stroke();
        text(String(answerOpts[i]), x + bw / 2, y + 33, 34, C.dim, "center", "700");
      }
    }
  }

  /* prompts */
  let hint = "";
  if (state === St.MOVE) {
    hint = crane.carry
      ? "stick ←→ drive  ·  stick ↑↓ raise and lower  ·  A — drop the car"
      : "stick ←→ drive  ·  stick ↑↓ raise and lower  ·  A — pick up a car" + (pileCount() === 0 ? "  ·  Y — start again" : "");
  } else if (state === St.ANSWER) hint = "◀ ▶ pick the number  ·  A — that's my answer  ·  B — back to the cars";
  else if (state === St.RESULT) hint = (result.ok || resultT > 2.4)
    ? (probIdx + 1 >= probsPerStudent ? "A — next student" : "A — next problem")
    : "";
  if (hint) text(hint, V.w / 2, 866, 21, C.dim, "center", "600", 1);

  /* first-move nudge */
  if (state === St.MOVE && !crane.carry && cars.every(c => c.g === -1)) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 4);
    text(Q.mode === "share" ? "share them out — one circle at a time" : "fill a circle, then the next one opens",
         V.w / 2, 812, 27, C.divisor, "center", "700", 2);
    ctx.globalAlpha = 1;
  }

  if (state === St.RESULT) {
    if (result.ok) {
      const pop = Math.min(1, resultT * 4);
      ctx.globalAlpha = pop;
      text("YES", V.w / 2, 292, 58 + pop * 6, C.quotient, "center", "800", 8);
      ctx.globalAlpha = 1;
    } else if (resultT > 2.4) {
      text(Q.mode === "share" ? "count one circle again" : "count the circles again",
           V.w / 2, 292, 30, C.remainder, "center", "700", 2);
    }
  }

  /* badges */
  text("STUDENT " + student, 40, 44, 21, C.dim, "left", "700", 3);
  text((scores[student] || 0) + " PTS", V.w - 40, 44, 21, C.dim, "right", "700", 3);
  // progress through this student's turn: dots while they fit, else a count
  if (probsPerStudent <= 7) {
    for (let i = 0; i < probsPerStudent; i++) {
      const x = 60 + i * 30, y = 78;
      ctx.fillStyle = i < probIdx ? C.quotient : (i === probIdx ? C.divisor : C.faint);
      ctx.beginPath(); ctx.arc(x, y, i === probIdx ? 10 : 8, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    text((probIdx + 1) + " / " + probsPerStudent, 40, 80, 21, C.divisor, "left", "800", 2);
  }
}

function ease(c, tg) {
  if (!tg) return;
  if (!c.seeded) { c.x = tg.x; c.y = tg.y; c.w = tg.w; c.seeded = true; return; }
  c.x += (tg.x - c.x) * 0.22;
  c.y += (tg.y - c.y) * 0.22;
  c.w += (tg.w - c.w) * 0.22;
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
